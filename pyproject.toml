[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-projections"
version = "1.6.0"
description = "NFL fantasy projections pipeline: next-week player stats and FanDuel points, with floor/median/ceiling ranges and a DFS optimizer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gin-G" }]
keywords = ["nfl", "fantasy", "projections", "dfs", "nflverse"]

# Everything needed to build data, train, and run ProjectionService.
dependencies = [
    "nflreadpy",
    "pandas",
    "numpy",
    # Capped, and the cap is load-bearing. pyarrow 18+ declares NO numpy
    # requirement at all, so pip resolves the newest (26.0.0) against whatever
    # numpy is present and the import then fails at runtime: "pyarrow requires
    # NumPy 2.0 or newer, found 1.26.4". That took out NFL-API's roster sync on
    # 2026-10-15 and every nfl-api-projections run after it, because that job
    # pip-installs this package over an image whose own pin cannot survive a
    # resolve it does not control. Lifting it means moving to numpy 2.x here
    # and in NFL-API together.
    "pyarrow>=7.0.0,<18",
    "scikit-learn",
    "tensorflow",
    "joblib",
    "tqdm",
    "requests",
]

[project.optional-dependencies]
plot = ["matplotlib"]        # learning-curve PNGs (off by default in the service)
dev = ["pytest", "pytest-cov"]

[project.scripts]
nfl-projections = "nfl_projections.cli:main"

[project.urls]
Repository = "https://github.com/Gin-G/nfl-data-py"

[tool.setuptools]
packages = ["nfl_projections"]

[tool.pytest.ini_options]
testpaths = ["tests"]
