name: Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # The suite runs on pure logic (TF / sklearn / nflreadpy are imported
        # lazily and not exercised), so only these lightweight deps are needed.
        # Because the package is installed with --no-deps (to avoid dragging in
        # TensorFlow), anything it imports at runtime has to be listed here:
        #   requests — pulled in by importing the package (service -> predict
        #              -> injuries)
        #   joblib   — TrainedModel/QuantileModel .save()/.load() persist the
        #              preprocessor through it, and the tests exercise that
        # Both are small and pure Python, so the job stays fast.
        run: |
          pip install pandas numpy requests joblib pytest pytest-cov
          pip install -e . --no-deps
      - name: Run pytest
        run: pytest --cov=nfl_projections --cov-report=xml
      - name: Upload results to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
